<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062E19"/>
      <stop offset="50%" stop-color="#0F5C31"/>
      <stop offset="100%" stop-color="#19944E"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="14" y="14" width="228" height="228" rx="54" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="220" height="220" rx="50" fill="none" stroke="#4ADE80" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Subtle Globe / Network Arcs -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="128" cy="128" r="68" fill="none" stroke="#4ADE80" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Main Security Shield -->
  <path d="M128 38 L200 66 V122 C200 171 169 206 128 220 C87 206 56 171 56 122 V66 Z"
        fill="url(#shieldGrad)" fill-opacity="0.22" stroke="#4ADE80" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Inner Shield Highlight -->
  <path d="M128 50 L188 74 V120 C188 162 162 192 128 205 C94 192 68 162 68 120 V74 Z"
        fill="#072615" fill-opacity="0.55"/>

  <!-- Padlock Shackle -->
  <path d="M104 118 V98 C104 84.7 114.7 74 128 74 C141.3 74 152 84.7 152 98 V118"
        fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>

  <!-- Padlock Body -->
  <rect x="92" y="114" width="72" height="58" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Keyhole in Gold/Green -->
  <circle cx="128" cy="138" r="8" fill="#0F5C31"/>
  <path d="M128 143 L128 157" stroke="#0F5C31" stroke-width="7" stroke-linecap="round"/>

  <!-- Active Connection Dot Badge -->
  <circle cx="184" cy="72" r="14" fill="url(#goldGrad)" stroke="#062E19" stroke-width="4"/>
</svg>
